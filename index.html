<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>大欅旅館</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1d1b18; color: #f1ece2;
    font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif; }
  canvas#view { display: block; width: 100%; height: 100%; }

  /* ---- ローディング ---- */
  #loading { position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 18px; background: radial-gradient(ellipse at 50% 35%, #3a3026 0%, #1d1b18 70%);
    transition: opacity .6s; }
  #loading.done { opacity: 0; pointer-events: none; }
  #loading h1 { margin: 0; font-size: 22px; font-weight: 500; letter-spacing: .4em; text-indent: .4em; }
  .lantern-wrap { height: 150px; width: 120px; position: relative; }
  .lantern { position: absolute; left: 50%; top: 0; width: 0; height: 0; transform-origin: 50% 0;
    animation: sway 2.6s ease-in-out infinite alternate; }
  .lantern svg { position: absolute; left: -45px; top: 0; overflow: visible; }
  .lantern .glow { animation: flicker 1.7s ease-in-out infinite; transform-origin: 45px 78px; }
  @keyframes sway { from { transform: rotate(-9deg); } to { transform: rotate(9deg); } }
  @keyframes flicker { 0%,100% { opacity: .95; } 40% { opacity: .75; } 70% { opacity: 1; } }
  .leaf { position: absolute; top: -20px; width: 14px; height: 18px; border-radius: 0 100% 0 100%;
    background: #b9602a; opacity: 0; animation: fall linear infinite; }
  @keyframes fall { 0% { transform: translate(0,0) rotate(0); opacity: 0; } 10% { opacity: .85; }
    100% { transform: translate(var(--dx), 110vh) rotate(var(--rot)); opacity: .2; } }
  #bar { width: min(420px, 70vw); height: 6px; border-radius: 3px; background: #3b3329; overflow: hidden; }
  #bar i { display: block; height: 100%; width: 0%; background: linear-gradient(90deg, #c98a3d, #f0c36b); transition: width .15s; }
  #pct { font-size: 28px; font-variant-numeric: tabular-nums; letter-spacing: .08em; }
  #msg { font-size: 13px; color: #b8ad98; min-height: 1.4em; }

  /* ---- 操作案内 ---- */
  #start { position: fixed; inset: 0; z-index: 5; display: none; place-items: center; background: rgba(20,18,15,.55);
    cursor: pointer; text-align: center; line-height: 1.9; }
  #start.show { display: grid; }
  #start .card { background: rgba(24,21,17,.88); border: 1px solid #5b4f3e; border-radius: 10px; padding: 22px 34px; }
  #start h2 { margin: 0 0 8px; font-size: 20px; font-weight: 500; letter-spacing: .2em; }
  #start .go { margin-top: 10px; color: #f0c36b; }
  kbd { background: #3a3228; border: 1px solid #6b5d48; border-radius: 3px; padding: 0 5px; font-size: 12px; }
  #hud { position: fixed; left: 12px; top: 12px; z-index: 3; font-size: 12px; line-height: 1.6; color: #e6dcc6;
    background: rgba(24,21,17,.6); border-radius: 6px; padding: 6px 10px; pointer-events: none; white-space: pre; }
  /* ---- 会話（字幕） ---- */
  #dialog { position: fixed; left: 50%; bottom: 7vh; z-index: 4; transform: translate(-50%, 8px); opacity: 0;
    min-width: min(520px, 86vw); max-width: 86vw; box-sizing: border-box; padding: 14px 26px 16px;
    background: rgba(14, 12, 10, .78); border: 1px solid rgba(240, 195, 107, .45); border-radius: 10px;
    box-shadow: 0 6px 24px rgba(0,0,0,.45); pointer-events: none; transition: opacity .25s, transform .25s; }
  #dialog.show { opacity: 1; transform: translate(-50%, 0); }
  #dialog .who { display: inline-block; margin-bottom: 6px; padding: 1px 12px; border-radius: 4px;
    background: #7a4a1c; color: #fbe9c6; font-size: 14px; letter-spacing: .1em; }
  #dialog .who.player { background: #2f4f6b; color: #dceaf7; }
  #dialog .line { font-size: 22px; line-height: 1.6; color: #fff; text-shadow: 0 1px 3px #000; }
  #dialog .hint { display: none; margin-top: 8px; font-size: 12px; color: #b8ad98; }
  #dialog.asking .hint { display: flex; align-items: center; gap: 10px; }
  #dialog .timer { flex: 1; height: 3px; border-radius: 2px; background: rgba(255,255,255,.15); overflow: hidden; }
  #dialog .timer i { display: block; height: 100%; width: 100%; background: #f0c36b; }
  #cross { position: fixed; left: 50%; top: 50%; width: 4px; height: 4px; margin: -2px; border-radius: 50%;
    background: rgba(255,255,255,.7); z-index: 2; pointer-events: none; }
</style>
</head>
<body>
<canvas id="view"></canvas>
<div id="cross"></div>
<div id="hud"></div>
<div id="dialog"><div class="who"></div><div class="line"></div>
  <div class="hint"><span><kbd>Space</kbd>／クリックで返事・頭をクリックすると…</span><span class="timer"><i></i></span></div></div>
<div id="start"><div class="card">
  <h2>大欅旅館</h2>
  <div><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> 移動　<kbd>Shift</kbd> 走る　マウス 視点　<kbd>Esc</kbd> カーソルを戻す</div>
  <div><kbd>1</kbd>〜<kbd>9</kbd>・<kbd>[</kbd><kbd>]</kbd> 出発点へ移動</div>
  <div class="go">クリックで開始</div>
</div></div>
<div id="loading">
  <div class="lantern-wrap"><div class="lantern">
    <svg width="90" height="150" viewBox="0 0 90 150">
      <line x1="45" y1="0" x2="45" y2="22" stroke="#6b5d48" stroke-width="2"/>
      <rect x="30" y="20" width="30" height="8" rx="2" fill="#2a2119"/>
      <ellipse class="glow" cx="45" cy="78" rx="34" ry="46" fill="#ffb347" opacity=".25"/>
      <path d="M32 28 Q10 78 32 128 L58 128 Q80 78 58 28 Z" fill="#e8a14a" stroke="#7a4a1c" stroke-width="2"/>
      <path d="M31 54 Q45 58 59 54 M26 78 Q45 83 64 78 M31 102 Q45 106 59 102" fill="none" stroke="#7a4a1c" stroke-width="2"/>
      <rect x="30" y="126" width="30" height="8" rx="2" fill="#2a2119"/>
      <line x1="45" y1="134" x2="45" y2="146" stroke="#b9602a" stroke-width="3"/>
      <text x="45" y="86" text-anchor="middle" font-size="22" font-weight="700" fill="#5a2f10" font-family="serif">欅</text>
    </svg>
  </div></div>
  <h1>大欅旅館</h1>
  <div id="bar"><i></i></div>
  <div id="pct">0%</div>
  <div id="msg">読み込み中…</div>
</div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
